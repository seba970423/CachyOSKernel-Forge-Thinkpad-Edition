# ThinkPad feature defaults

# General-purpose capabilities default to preserving upstream. The builder may
# remove them only after an explicit user choice.
DEFAULT_KEEP_KVM="yes"
DEFAULT_KEEP_INTEL_TDX="yes"
DEFAULT_KEEP_AMD_SEV="yes"

# Specialized NVMe transports and target functionality are preserved from
# upstream. Laptop-oriented policy must not break an existing userspace setup.
DEFAULT_KEEP_NVME_FABRICS="yes"
DEFAULT_KEEP_NVME_TARGET="yes"

# Desktop-style latency tuning: assert 1000Hz tick + scheduler autogrouping
# (CachyOS already ships both by default; this is a safety net for variants
# that don't), and switch transparent hugepages from CachyOS's default
# "always" to "madvise" to cut khugepaged compaction stalls. Off by default
# -- this is a workload-shaping choice, not a portability concern -- and
# declining it never forces any of these below the upstream baseline.
DEFAULT_ENABLE_LATENCY_TUNING="no"
